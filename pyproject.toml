[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "yiedu-api"
version = "0.4.0"
description = "YiEdu learning scaffold: FastAPI + PostgreSQL"
requires-python = ">=3.15,<3.16"
dependencies = [
  "fastapi==0.162.0", "uvicorn==0.54.0", "sqlalchemy==2.1.6",
  "psycopg[binary]==3.3.6", "pydantic-settings==2.16.1", "alembic==1.20.1", "nh3==0.3.7", "tinycss2==1.5.1"
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx==0.28.1", "ruff==0.17.2"]
docs = ["mkdocs==1.6.1", "mkdocs-material==9.7.7"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a dedicated PostgreSQL database"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
