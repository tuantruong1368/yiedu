name: Verify YiEdu
on: [push, pull_request]
permissions:
  contents: read
jobs:
  product:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: yiedu_test
          POSTGRES_USER: yiedu
          POSTGRES_PASSWORD: ci_only_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U yiedu -d yiedu_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://yiedu:ci_only_password@localhost:5432/yiedu_test
      TEST_DATABASE_URL: postgresql+psycopg://yiedu:ci_only_password@localhost:5432/yiedu_test
      ADMIN_API_KEY: ci-only-key-not-for-production-1234567890
      API_INTERNAL_URL: http://127.0.0.1:8000
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.15.1'
          cache: pip
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26.12.1'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -r requirements.lock
      - run: pip install --no-deps -e .
      - run: ruff check .
      - run: python scripts/check_docs.py
      - run: python scripts/check_contracts.py
      - run: mkdocs build --strict
      - run: alembic upgrade head
      - run: alembic check
      - run: alembic downgrade base
      - run: alembic upgrade head
      - run: pytest -q
      - run: npm install --global npm@12.2.1
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: nohup uvicorn yiedu.main:app --host 127.0.0.1 --port 8000 > /tmp/yiedu-api.log 2>&1 &
      - run: npm run test:e2e
        working-directory: web
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: browser-evidence
          path: |
            .build/screenshots
            web/test-results
  mobile:
    runs-on: ubuntu-latest
    env:
      EXPO_OFFLINE: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26.12.1'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm install --global npm@12.2.1
      - run: npm ci
        working-directory: mobile
      - run: npx expo install --check
        working-directory: mobile
      - run: npm run typecheck
        working-directory: mobile
      - run: npx expo export --platform android --platform ios --output-dir ../.build/mobile
        working-directory: mobile
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: python3 scripts/bootstrap.py
      - name: Reproduce private host config permissions
        run: chmod 600 pyproject.toml alembic.ini
      - run: docker compose up --build -d
      - run: curl --retry 15 --retry-delay 2 --retry-all-errors --fail http://localhost:8000/health/ready
      - run: curl --retry 15 --retry-delay 2 --retry-all-errors --fail http://localhost:3000/ > /tmp/yiedu-home.html
      - run: curl --fail http://localhost:3000/illustrations/yoga-practice.svg > /tmp/yiedu-yoga.svg
      - run: docker compose logs --tail 60
        if: failure()
      - run: docker compose down
        if: always()
  database-upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: python3 scripts/bootstrap.py
      - run: docker compose -f compose.pg17.yaml up -d --wait db
      - run: docker compose build migrate
      - run: docker compose run --rm --no-deps migrate
      - run: docker compose run --rm -T --no-deps api python - seed < tests/upgrade_fixture.py
      - name: Seed PostgreSQL 17 migration probe
        run: |
          docker compose -f compose.pg17.yaml exec -T db sh -c 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"' <<'SQL'
          CREATE TABLE upgrade_probe (id integer PRIMARY KEY, payload text NOT NULL);
          INSERT INTO upgrade_probe VALUES (1, 'YiEdu tiếng Việt — dữ liệu cũ');
          SQL
      - run: python3 scripts/upgrade_postgres.py
      - run: docker compose run --rm -T --no-deps api python - verify < tests/upgrade_fixture.py
      - name: Verify preserved data on PostgreSQL 18
        run: |
          docker compose exec -T db sh -c 'psql -X -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT payload FROM upgrade_probe WHERE id=1"' > /tmp/probe.txt
          python3 -c 'from pathlib import Path; assert Path("/tmp/probe.txt").read_text().strip() == "YiEdu tiếng Việt — dữ liệu cũ"'
      - run: docker compose up --build -d
      - run: curl --retry 15 --retry-delay 2 --retry-all-errors --fail http://localhost:8000/health/ready
      - run: docker compose logs --tail 60
        if: failure()
      - run: docker compose down
        if: always()
